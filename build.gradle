plugins {
    id 'java-library'
}

group = 'pl.kuba6000.ae2webintegration'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.google.guava:guava:21.0'
    implementation 'commons-io:commons-io:2.5'
    implementation 'org.apache.commons:commons-lang3:3.5'
    implementation 'club.minnced:discord-webhooks:0.8.2'
    // Log4j is provided by Minecraft at runtime — implementation for standalone core tests
    implementation 'org.apache.logging.log4j:log4j-api:2.17.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.2'
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// This submodule is pure Java (no Minecraft/Forge references).
// Mark outgoing artifacts as already deobfuscated so RFG does not
// attempt to run DependencyDeobfuscationTransform on this jar.
configurations.configureEach {
    if (canBeConsumed) {
        outgoing.attributes.attribute(
            org.gradle.api.attributes.Attribute.of('rfgDeobfuscatorTransformed', Boolean),
            true
        )
    }
}
