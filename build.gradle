plugins {
    id 'java-library'
    // Deliberately no version: when this module is included as a submodule of an integration branch that
    // branch already has spotless on the classpath (7.0.2 on modern, 6.24.0 on legacy) and Gradle rejects
    // a version request in that case. Standalone builds get the version from settings.gradle.
    id 'com.diffplug.spotless' apply false
}

// Core owns its formatting: run `./gradlew spotlessApply` from inside core/.
//
// The rules are the shared GTNH config, vendored here the same way the modern integration branches vendor
// it, so the whole project formats identically. Applied only when core is the root project: the branches
// pin different engine versions (modern eclipse 4.31, legacy 4.19 via Blowdryer), so letting a parent
// build format this submodule would rewrite it back and forth depending on which worktree it sits in.
if (project == rootProject) {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        encoding 'UTF-8'

        java {
            target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'tools/openapi-doclet/src/**/*.java'

            def orderFile = project.file('spotless/spotless.importorder')
            def formatFile = project.file('spotless/spotless.eclipseformat.xml')

            toggleOffOn()
            importOrderFile(orderFile)
            removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
            endWithNewline()
            eclipse('4.31').configFile(formatFile)
        }
    }
}

group = 'pl.kuba6000.ae2webintegration'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = 'https://files.prismlauncher.org/maven/'
        content {
            includeVersion 'org.apache.logging.log4j', 'log4j-api', '2.0-beta9-fixed'
        }
        // Prism publishes the patched Minecraft library without a POM, as used by RetroFuturaGradle.
        metadataSources {
            artifact()
        }
    }
    maven {
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
        content {
            includeGroup 'com.github.bsideup.jabel'
        }
    }
}

dependencies {
    compileOnly 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.1'
    testCompileOnly 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.1'
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.1'
    testAnnotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.1'

    compileOnlyApi 'org.jetbrains:annotations:26.0.2'
    // Minecraft supplies Gson. Compile against the oldest supported API instead of bundling a newer one.
    compileOnlyApi 'com.google.code.gson:gson:2.2.4'
    implementation 'com.google.guava:guava:21.0'
    implementation 'commons-io:commons-io:2.5'
    implementation 'org.apache.commons:commons-lang3:3.5'
    // Compile against the oldest supported Logger API, matching the patched 1.7.10 dependency.
    // Minecraft supplies Log4j at runtime; do not publish or bundle this dependency.
    compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9-fixed'
    // Testing
    testImplementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.17.2'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.17.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Exercise the real HTTP boundary with the Gson versions supplied by legacy Minecraft.
['224': '2.2.4', '280': '2.8.0'].each { suffix, gsonVersion ->
    def legacyRuntime = configurations.create("gson${suffix}TestRuntime") {
        canBeConsumed = false
        extendsFrom configurations.testImplementation, configurations.testRuntimeOnly
        resolutionStrategy.force "com.google.code.gson:gson:${gsonVersion}"
    }
    def compatibilityTest = tasks.register("testGson${suffix}", Test) {
        group = 'verification'
        description = "Test HTTP requests and responses with Gson ${gsonVersion}."
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.output + sourceSets.main.output + legacyRuntime
        useJUnitPlatform()
        filter {
            includeTestsMatching '*ApiRoutingHttpTest'
            includeTestsMatching '*ServerLifecycleHttpTest'
            includeTestsMatching '*RequestCompletionTest'
        }
        shouldRunAfter tasks.named('test')
    }
    tasks.named('check') { dependsOn compatibilityTest }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Without this javac reads sources in the platform default encoding, so a non-ASCII literal compiles
// differently depending on the machine that built it.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // IDEA imports this task value; its default follows --release rather than java.sourceCompatibility.
    sourceCompatibility = JavaVersion.VERSION_17
    // Jabel enables newer syntax; --release keeps both JDK API usage and bytecode at Java 8.
    options.release = 8
}

// This submodule is pure Java (no Minecraft/Forge references).
// Mark outgoing artifacts as already deobfuscated so RFG does not
// attempt to run DependencyDeobfuscationTransform on this jar.
configurations.configureEach {
    if (canBeConsumed) {
        outgoing.attributes.attribute(
            org.gradle.api.attributes.Attribute.of('rfgDeobfuscatorTransformed', Boolean),
            true
        )
    }
}

// Documentation is an explicit standalone build operation, never part of a Minecraft runtime artifact.
if (project == rootProject) {
    def buildApiDoclet = tasks.register('buildApiDoclet', GradleBuild) {
        dir = file('tools/openapi-doclet')
        tasks = ['docletPath']
    }
    def docletFiles = fileTree('tools/openapi-doclet/build/doclet') { include '*.jar' }
    def apiDocumentation = layout.buildDirectory.file('api-docs/openapi.json')
    def apiDocumentationVersion = providers.gradleProperty('apiDocumentationVersion').getOrElse('development')
    def documentationJdk = javaToolchains.javadocToolFor(java.toolchain)
    tasks.register('generateApiDocs', Exec) {
        group = 'documentation'
        description = 'Generate OpenAPI from the HTTP endpoint declarations and Javadoc.'
        dependsOn buildApiDoclet
        notCompatibleWithConfigurationCache('The doclet is built independently before its classpath is resolved.')
        inputs.files(sourceSets.main.allJava, sourceSets.main.compileClasspath, docletFiles)
        inputs.property('apiDocumentationVersion', apiDocumentationVersion)
        outputs.file(apiDocumentation)
        doFirst {
            // Javadoc tasks inject HTML-only flags. Write an argument file for the custom doclet instead.
            def options = new org.gradle.external.javadoc.StandardJavadocDocletOptions()
            options.noTimestamp = false
            options.source = '17'
            options.encoding = 'UTF-8'
            options.doclet = 'pl.kuba6000.ae2webintegration.doclet.OpenApiDoclet'
            options.docletpath = docletFiles.files.toList()
            options.classpath = sourceSets.main.compileClasspath.files.toList()
            options.sourceNames = sourceSets.main.allJava.files.collect { it.absolutePath }.sort()
            options.addStringOption('-output', apiDocumentation.get().asFile.absolutePath)
            options.addStringOption('-api-version', apiDocumentationVersion)
            def argumentsFile = new File(temporaryDir, 'javadoc.options')
            options.write(argumentsFile)
            commandLine documentationJdk.get().executablePath.asFile, "@${argumentsFile.absolutePath}"
        }
    }
}
