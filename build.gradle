plugins {
    id 'base'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

apply from: 'gradle/idea-settings.gradle'
idea.project.settings.taskTriggers.afterSync tasks.named('updateIdeaEntryPoints')

def adapters = ['forge-1.7.10', 'forge-1.12.2', 'forge-1.20.1', 'neoforge-1.21.1']
tasks.named('assemble') { dependsOn adapters.collect { gradle.includedBuild(it).task(':assemble') } }
tasks.named('check') {
    dependsOn gradle.includedBuild('core').task(':check')
    dependsOn adapters.collect { gradle.includedBuild(it).task(':check') }
}
