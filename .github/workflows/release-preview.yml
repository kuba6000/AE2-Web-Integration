name: Preview release

on:
  workflow_dispatch:
    inputs:
      minecraft:
        description: Minecraft version
        type: choice
        required: true
        options: ['1.7.10', '1.12.2', '1.20.1', '1.21.1']
      ref:
        description: Branch or commit with release tooling (empty uses the Minecraft branch)
        type: string
      tag:
        description: Proposed full tag, for example 2.0.0-forge-1.7.10
        type: string
        required: true

# GitHub's generate-notes API needs contents:write; no step publishes a release.
permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.tag }}
      MINECRAFT: ${{ inputs.minecraft }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.minecraft }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Test release preparation
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_release_*.py'
      - name: Prepare shared release description
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          loader=forge
          if [[ "$MINECRAFT" == '1.21.1' ]]; then loader=neoforge; fi
          python3 .github/scripts/release_notes.py \
            --tag "$VERSION" --minecraft "$MINECRAFT" --loader "$loader" \
            --repository "$GITHUB_REPOSITORY" --output build/release/notes.md \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - uses: actions/setup-java@v4
        if: inputs.minecraft == '1.7.10'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and exercise both publishers without uploading
        run: |
          chmod +x gradlew
          python3 .github/scripts/release_preview.py --minecraft "$MINECRAFT" \
            --release-type "${{ steps.notes.outputs.release_type }}" --notes build/release/notes.md
      - name: Stage and preview GitHub release
        run: |
          python3 .github/scripts/release_bundle.py stage \
            --manifest build/release/manifest.json --metadata build/release/metadata.json \
            --output build/release/bundle
          python3 .github/scripts/release_bundle.py github \
            --bundle build/release/bundle --repository "$GITHUB_REPOSITORY"
          cat build/release/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-preview-${{ inputs.minecraft }}
          path: build/release/bundle/
          if-no-files-found: error
          retention-days: 14
