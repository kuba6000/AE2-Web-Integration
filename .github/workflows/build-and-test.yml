
name: Build and test core

on:
  pull_request:
    branches: [ core ]
  push:
    branches: [ core ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Test core pin updater
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test web terminal behavior
        run: node --test src/test/js/*.test.cjs

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test core
        run: ./gradlew --build-cache --info --stacktrace build
