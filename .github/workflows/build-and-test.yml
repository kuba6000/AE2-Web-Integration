name: Build and test core

on:
  pull_request:
    branches: [core, master, main]
  push:
    branches: [core, master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    defaults:
      run:
        working-directory: core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend build tools
        run: npm ci

      - name: Install browser test tools
        working-directory: core/tools/ui-tests
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('core/tools/ui-tests/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: core/tools/ui-tests
        run: npx playwright install --with-deps chromium

      - name: Test terminal in Chromium
        working-directory: core/tools/ui-tests
        run: npm test

  core:
    defaults:
      run:
        working-directory: core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Test repository automation
        run: python3 -m unittest discover -s ../.github/scripts/tests -p 'test_*.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend formatting, lint and types
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Test PHP proxy
        run: |
          php --version
          php -l tools/php-proxy/index.php
          node --test src/test/php/*.test.cjs

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test core
        run: ./gradlew --build-cache --info --stacktrace build

      - name: Test API documentation generator
        run: ./gradlew -p tools/openapi-doclet --build-cache test

      - name: Generate OpenAPI
        run: ./gradlew generateApiDocs -PapiDocumentationVersion=${{ github.sha }}

      - name: Upload API specification
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: core/build/api-docs/openapi.json
          if-no-files-found: error

  adapters:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        directory: [forge-1.7.10, forge-1.12.2, forge-1.20.1, neoforge-1.21.1]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --build-cache --stacktrace build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.directory }}-jars
          path: ${{ matrix.directory }}/build/libs/
  build-and-test:
    if: always()
    needs: [core, browser-tests, adapters]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values())'
