name: Test Scala Presence

on:
  pull_request:
    branches: [core, master, main]
  push:
    branches: [core, master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-scala-presence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect scala presence
        shell: bash
        run: |
          ! grep -E -r 'import scala\.' core/src/main/java forge-1.7.10/src/main/java forge-1.12.2/src/main/java forge-1.20.1/src/main/java neoforge-1.21.1/src/main/java neoforge-26.1.2/src/main/java
