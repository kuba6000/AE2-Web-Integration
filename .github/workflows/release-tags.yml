name: Release tagged build

on:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      snapshot: ${{ steps.notes.outputs.snapshot }}
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Test release preparation
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_release_*.py'

      - name: Prepare shared release description
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/release_notes.py \
            --tag "$VERSION" --minecraft '1.21.1' --loader 'neoforge' \
            --repository "$GITHUB_REPOSITORY" --output build/release/notes.md \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and exercise both publishers without uploading
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --no-configuration-cache --stacktrace \
            assemble releasePreview releaseModrinth releaseCurseforge \
            -PreleaseDryRun=true -PreleaseType="${{ steps.notes.outputs.release_type }}" \
            -PreleaseNotesFile=build/release/notes.md

      - name: Stage verified production JAR and description
        run: |
          python3 .github/scripts/release_bundle.py stage \
            --manifest build/release/manifest.json --metadata build/release/metadata.json \
            --output build/release/bundle
          cat build/release/notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-1.21.1
          path: build/release/bundle/
          if-no-files-found: error
          retention-days: 14

  github:
    needs: build
    if: github.repository == 'kuba6000/AE2-Web-Integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-1.21.1
          path: release-bundle
      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/release_bundle.py github \
            --bundle release-bundle --repository "$GITHUB_REPOSITORY" --publish

  portals:
    needs: build
    if: >-
      github.repository == 'kuba6000/AE2-Web-Integration' &&
      needs.build.outputs.snapshot != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [modrinth, curseforge]
    name: Publish to ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-1.21.1
          path: release-bundle
      - name: Verify immutable release bundle
        id: bundle
        run: |
          python3 .github/scripts/release_bundle.py export \
            --bundle release-bundle --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to Modrinth
        if: matrix.platform == 'modrinth'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_ARTIFACT: ${{ steps.bundle.outputs.artifact }}
          RELEASE_NOTES: ${{ steps.bundle.outputs.notes }}
          RELEASE_SHA512: ${{ steps.bundle.outputs.sha512 }}
          RELEASE_MANIFEST: ${{ steps.bundle.outputs.manifest }}
          RELEASE_TYPE: ${{ steps.bundle.outputs.release_type }}
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace releaseModrinth \
            -PreleaseDryRun=false -PreleaseType="$RELEASE_TYPE" \
            -PreleaseArtifactFile="$RELEASE_ARTIFACT" -PreleaseArtifactSha512="$RELEASE_SHA512" \
            -PreleaseBundleManifest="$RELEASE_MANIFEST" \
            -PreleaseNotesFile="$RELEASE_NOTES"
      - name: Publish to CurseForge
        if: matrix.platform == 'curseforge'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          RELEASE_ARTIFACT: ${{ steps.bundle.outputs.artifact }}
          RELEASE_NOTES: ${{ steps.bundle.outputs.notes }}
          RELEASE_SHA512: ${{ steps.bundle.outputs.sha512 }}
          RELEASE_MANIFEST: ${{ steps.bundle.outputs.manifest }}
          RELEASE_TYPE: ${{ steps.bundle.outputs.release_type }}
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace releaseCurseforge \
            -PreleaseDryRun=false -PreleaseType="$RELEASE_TYPE" \
            -PreleaseArtifactFile="$RELEASE_ARTIFACT" -PreleaseArtifactSha512="$RELEASE_SHA512" \
            -PreleaseBundleManifest="$RELEASE_MANIFEST" \
            -PreleaseNotesFile="$RELEASE_NOTES"
