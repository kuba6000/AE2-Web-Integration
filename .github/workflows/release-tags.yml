name: Release tagged build
on:
  push:
    tags: ["[0-9]*"]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'kuba6000/AE2-Web-Integration'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      notes_sha: ${{ steps.plan.outputs.notes_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ github.ref_name }}
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if gh run download "$GITHUB_RUN_ID" --name release-plan --dir frozen-plan; then
            cp frozen-plan/release-plan.json release-plan.json
          else
            # A failed preflight may be retried before any tags were published. Once publication
            # started, missing/expired evidence must never silently select newer authored notes.
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" > attempts.json
            python3 -c 'import json; jobs=[j for p in json.load(open("attempts.json")) for j in p["jobs"]]; assert not any(s["name"] == "Publish variant tags" and s["status"] != "queued" and s.get("conclusion") != "skipped" for j in jobs for s in j.get("steps", [])), "Frozen release plan is missing after publication started"'
            python3 .github/scripts/coordinate_release.py prepare --repository "$GITHUB_REPOSITORY" --source-tag "$SOURCE_TAG" --core-sha "$sha" --branch "$MAIN_BRANCH" --plan release-plan.json
            echo "new_plan=true" >> "$GITHUB_OUTPUT"
          fi
          python3 -c 'import json,os; p=json.load(open("release-plan.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); print("targets="+json.dumps(p["targets"]),file=f); print("notes_sha="+p["notes_sha"],file=f)'
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.new_plan == 'true'
        with:
          name: release-plan
          path: release-plan.json
          retention-days: 90
      - name: Publish variant tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ github.ref_name }}
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          python3 .github/scripts/coordinate_release.py publish --repository "$GITHUB_REPOSITORY" --source-tag "$SOURCE_TAG" --core-sha "$sha" --branch "$MAIN_BRANCH" --plan release-plan.json
  publish:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-variant.yml
    with:
      tag: ${{ matrix.target.tag }}
      directory: ${{ matrix.target.directory }}
      minecraft: ${{ matrix.target.minecraft }}
      loader: ${{ matrix.target.loader }}
      sha: ${{ matrix.target.sha }}
      notes_sha: ${{ needs.prepare.outputs.notes_sha }}
    secrets: inherit
