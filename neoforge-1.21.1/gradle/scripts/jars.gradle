import org.gradle.jvm.tasks.Jar

tasks.register('slimJar', Jar) {
    dependsOn("classes")
    archiveClassifier = "dev-slim"
    from sourceSets.main.output
}


// Add sources jar to components.java
java {
    artifacts.archives(slimJar)
    withSourcesJar()
}

base {
    archivesName = mod_id
}

afterEvaluate {
    if (!findProperty('usesShadowedDependencies')?.toString()?.toBoolean()) {
        jar.archiveClassifier = ''
    }
    tasks.withType(Jar).configureEach {
        destinationDirectory = file('build/libs/')
        manifest.attributes([
                'MixinConfigs': 'mixins.ae2webintegration.json',
                'Specification-Title': mod_id,
                'Specification-Version': project.version.toString(),
                'Specification-Vendor': 'kuba6000',
                'Implementation-Title': base.archivesName,
                'Implementation-Version': version,
                'Implementation-Vendor': 'kuba6000',
        ])
    }
}
