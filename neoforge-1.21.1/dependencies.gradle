dependencies {
    compileOnly(libs.jetbrains.annotations)

    jarJar(implementation('org.xerial:sqlite-jdbc')) {
        version {
            strictly '[3.36.0.3,4.0)'
            prefer '3.53.4.0'
        }
    }
    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.53.4.0'

    // Core submodule (pure Java — no NeoForge/MC/AE2 references)
    implementation 'pl.kuba6000.ae2webintegration:core:1.0-SNAPSHOT'
    // MC 1.21.1 dev runs load only this mod's classes dir; core must be on the run classpath
    additionalRuntimeClasspath 'pl.kuba6000.ae2webintegration:core:1.0-SNAPSHOT'

    // AE2
    implementation(neoforge.ae2)
    compileOnly(neoforge.ae2wtlib)

    // AE addons for compatibility //
    compileOnly(neoforge.advancedae)

    // Standard runtime mods //
    localRuntime(neoforge.jade)
    localRuntime(neoforge.spark)
    localRuntime(neoforge.modernfix)


    // Runtime Recipe Viewers //
    localRuntime(neoforge.emi)

    // Client-only runtime mods //
    clientLocalRuntime(neoforge.embeddium)

    // runtime test mods //
    //localRuntime(neoforge.advancedae)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation "net.neoforged:testframework:${libs.versions.neo.get()}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}
